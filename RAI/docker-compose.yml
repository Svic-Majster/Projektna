services:
  db:
    image: postgres:15
    container_name: svicmajster_db
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: svicmajster_mqtt
    restart: always
    ports:
    - "1883:1883"
    - "9001:9001"
    volumes:
    - ./mosquitto/config:/mosquitto/config
    - ./mosquitto/data:/mosquitto/data
    - ./mosquitto/log:/mosquitto/log

  faceid:
    build:
      # kontekst je koren repozitorija, da dosezemo skupni requirements.txt + ORV
      context: ..
      dockerfile: RAI/face-service/Dockerfile
    image: ${DOCKERHUB_USER:-svicmajster}/svicmajster-faceid:latest
    container_name: svicmajster_face
    restart: always
    ports:
      - "8000:8000"
    environment:
      - FACE_THRESHOLD=50
    volumes:
      # samo nauceni modeli (nastajajo ob enroll); ORV je zdaj zapecen v sliki
      - face_models:/app/models

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${DOCKERHUB_USER:-svicmajster}/svicmajster-backend:latest
    container_name: svicmajster_backend
    restart: always
    ports:
      - "3000:3000"
    # POZOR: v .env nastavi hostname-e na imena servisov, ne localhost:
    #   DB_HOST=db
    #   MQTT_URL=mqtt://mosquitto:1883
    #   FACE_SERVICE_URL=http://faceid:8000
    env_file: ./backend/.env
    depends_on:
      - db
      - mosquitto
      - faceid

volumes:
  postgres_data:
  face_models:
